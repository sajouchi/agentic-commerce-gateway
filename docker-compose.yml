services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: test3
      POSTGRES_PASSWORD: test3
      POSTGRES_DB: commerce_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test3 -d commerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

